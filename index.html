<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow - Tracker Profesional de Hábitos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="header-tag">Productividad & Enfoque</div>
      <h1>HabitTracaker</h1>
      <p id="current-date-text">Cargando fecha...</p>
    </header>

    <main class="main-content">
      <!-- Formulario para agregar hábitos con categorías -->
      <section class="card habit-form-section">
        <h2>Nuevo Hábito</h2>
        <form id="habit-form">
          <div class="input-row">
            <input 
              type="text" 
              id="habit-input" 
              placeholder="Ej. Leer 20 páginas, Estudiar algoritmos..." 
              autocomplete="off"
              required
            >
            <select id="habit-category" required>
              <option value="Estudio">📚 Estudio</option>
              <option value="Salud">💪 Salud / Fitness</option>
              <option value="Productividad">⚡ Productividad</option>
              <option value="Bienestar">🧘 Bienestar</option>
            </select>
          </div>
          <button type="submit" id="add-btn">Crear Hábito</button>
        </form>
      </section>

      <!-- Panel de Estadísticas -->
      <section class="card progress-section">
        <div class="progress-header">
          <h2>Rendimiento Diario</h2>
          <span id="progress-percentage">0%</span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <div class="stats-footer">
          <span id="progress-text">0 de 0 completados</span>
          <span id="active-streak-count">🔥 Racha activa: 0 días</span>
        </div>
      </section>

      <!-- Barra de Filtros -->
      <section class="filters-container">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="pending">Pendientes</button>
        <button class="filter-btn" data-filter="completed">Completados</button>
      </section>

      <!-- Lista de Hábitos -->
      <section class="habits-list-section">
        <ul id="habits-list" class="habits-list"></ul>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
