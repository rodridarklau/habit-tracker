<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow - Tracker de Hábitos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Encabezado principal -->
    <header class="app-header">
      <h1>HabitFlow 🎯</h1>
      <p>Construye consistencia día a día</p>
    </header>

    <main class="main-content">
      <!-- Sección del formulario para agregar hábitos -->
      <section class="habit-form-section">
        <h2>Nuevo Hábito</h2>
        <form id="habit-form">
          <input 
            type="text" 
            id="habit-input" 
            placeholder="Ej. Leer 20 minutos, Entrenar..." 
            autocomplete="off"
            required
          >
          <button type="submit" id="add-btn">Agregar</button>
        </form>
      </section>

      <!-- Panel de Estadísticas y Progreso Diario -->
      <section class="progress-section">
        <div class="progress-header">
          <h2>Progreso de Hoy</h2>
          <span id="progress-percentage">0%</span>
        </div>
        <div class="progress-bar-container">
          <div id="progress-bar-fill" class="progress-bar-fill"></div>
        </div>
        <p id="progress-text" class="progress-text">0 de 0 hábitos completados</p>
      </section>

      <!-- Lista de Hábitos -->
      <section class="habits-list-section">
        <h2>Tus Hábitos</h2>
        <ul id="habits-list" class="habits-list">
          <!-- Elementos generados dinámicamente con JavaScript -->
        </ul>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
