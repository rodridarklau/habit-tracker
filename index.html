<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow - Tracker de Hábitos</title>
  <!-- Enlazamos la hoja de estilos dentro de la carpeta css -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Encabezado con el título y propósito -->
    <header class="app-header">
      <h1>HabitFlow 🎯</h1>
      <p>Construye consistencia día a día</p>
    </header>

    <main class="main-content">
      <!-- Formulario para ingresar un nuevo hábito -->
      <section class="habit-form-section">
        <h2>Nuevo Hábito</h2>
        <form id="habit-form">
          <input 
            type="text" 
            id="habit-input" 
            placeholder="Ej. Leer 20 minutos, Entrenar..." 
            autocomplete="off"
            required
          >
          <button type="submit" id="add-btn">Agregar</button>
        </form>
      </section>

      <!-- Lista donde se mostrarán los hábitos creados -->
      <section class="habits-list-section">
        <h2>Tus Hábitos</h2>
        <ul id="habits-list" class="habits-list">
          <!-- JavaScript insertará los hábitos aquí dinámicamente -->
        </ul>
      </section>
    </main>
  </div>

  <!-- Enlazamos el archivo de lógica dentro de la carpeta js -->
  <script src="js/app.js"></script>
</body>
</html>
